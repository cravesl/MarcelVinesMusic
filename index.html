<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Merry Christmas</title>
<meta name="robots" content="noindex, nofollow">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Cdefs%3E%3ClinearGradient id='g' x1='0' y1='0' x2='1' y2='1'%3E%3Cstop offset='0' stop-color='%237a4dff'/%3E%3Cstop offset='1' stop-color='%23ff4f9a'/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect width='64' height='64' rx='16' fill='url(%23g)'/%3E%3Ctext x='32' y='43' font-family='Arial' font-weight='800' font-size='30' text-anchor='middle' fill='white'%3EMV%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;800&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{font-family:Poppins,system-ui,-apple-system,Segoe UI,sans-serif;color:#fff;overflow:hidden;
  background:linear-gradient(to bottom,#150d3a 0%,#3a1c7a 32%,#9a3a8f 60%,#ff7a6e 82%,#ffc08a 100%)}

/* sky */
.sky{position:fixed;inset:0;z-index:0;pointer-events:none}
.star{position:absolute;background:#fff;border-radius:50%;animation:tw 3s ease-in-out infinite}
.moon{position:absolute;top:6vh;right:8vw;width:54px;height:54px;border-radius:50%;background:#fff6d8;box-shadow:0 0 30px 10px rgba(255,246,216,.35)}
@keyframes tw{0%,100%{opacity:.25}50%{opacity:1}}

/* Santa + reindeer silhouette */
.santa{position:fixed;top:40vh;left:0;width:min(48vw,300px);z-index:1;color:#140a33;opacity:.9;pointer-events:none;
  transform:translateX(-115%);animation:fly 26s linear 4s infinite}
.santa svg{display:block;width:100%;height:auto;overflow:visible;animation:bob 3.2s ease-in-out infinite}
@keyframes fly{from{transform:translateX(-115%)}to{transform:translateX(108vw)}}
@keyframes bob{0%,100%{transform:translateY(0) rotate(-3deg)}50%{transform:translateY(-8px) rotate(-1deg)}}

/* snow */
.snow{position:fixed;inset:0;z-index:4;pointer-events:none;overflow:hidden}
.flake{position:absolute;top:0;background:#fff;border-radius:50%;animation:snow linear infinite}
@keyframes snow{from{transform:translate3d(0,-5vh,0)}to{transform:translate3d(var(--dx),105vh,0)}}

/* scene */
.scene{position:fixed;left:0;right:0;bottom:0;width:100%;height:42vh;z-index:2;overflow:visible;pointer-events:none}
@media (max-aspect-ratio:1/1){.scene{width:150%;left:-32%;right:auto}}
.tl{animation:tw 1.6s ease-in-out infinite}
.smoke{fill:#fff;opacity:0;transform-box:fill-box;transform-origin:center;animation:smoke 4.5s ease-out infinite}
@keyframes smoke{0%{opacity:.7;transform:translate(0,0) scale(.6)}100%{opacity:0;transform:translate(10px,-34px) scale(2)}}

/* message */
main{position:relative;z-index:3;min-height:100%;display:flex;flex-direction:column;justify-content:center;align-items:center;
  padding:32px 28px 30vh;text-align:center;text-shadow:0 2px 14px rgba(20,10,50,.55)}
h1{margin:0 0 16px;font-weight:800;font-size:clamp(2.8rem,13vw,5.5rem);line-height:1;letter-spacing:-.03em}
.line{margin:0 0 10px;font-size:clamp(1.05rem,4.2vw,1.4rem);max-width:22em}
.line b{font-weight:600}
.merry{margin:18px 0 6px;font-weight:800;font-size:clamp(1.5rem,6.5vw,2.4rem)}
.sign{margin:0;font-size:clamp(1rem,4vw,1.25rem);font-style:italic;opacity:.95}
.fade{opacity:0;transform:translateY(14px);animation:in .8s ease forwards}
@keyframes in{to{opacity:1;transform:none}}

@media (prefers-reduced-motion:reduce){
  .fade{animation:none;opacity:1;transform:none}
  .snow,.smoke{display:none}
  .star,.tl,.santa svg{animation:none}
  .santa{animation:none;left:50%;transform:translateX(-50%);top:46vh}
}
</style>
</head>
<body>

<div class="sky" id="sky"><div class="moon"></div></div>

<!-- Santa, sleigh and reindeer (silhouette) -->
<div class="santa" aria-hidden="true">
  <svg viewBox="0 0 290 72">
    <defs>
      <symbol id="deer" viewBox="0 0 42 38" overflow="visible">
        <ellipse cx="17" cy="20" rx="13" ry="6.5" fill="currentColor"/>
        <path d="M26 17 L32 10" stroke="currentColor" stroke-width="5" stroke-linecap="round" fill="none"/>
        <circle cx="33" cy="10" r="4.5" fill="currentColor"/>
        <path d="M35 11 L41 13" stroke="currentColor" stroke-width="3" stroke-linecap="round" fill="none"/>
        <path d="M32 6 L30 0 M31 3 L27 2 M34 6 L37 0 M35.5 3 L39 1.5" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" fill="none"/>
        <path d="M9 24 L3 33 M13 25 L8 36 M23 25 L31 31 M27 23 L36 27 M5 18 L1 15" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" fill="none"/>
      </symbol>
    </defs>
    <g fill="currentColor" stroke="currentColor">
      <path d="M10 38 L70 38 Q80 30 86 32 Q82 50 68 54 L16 54 Q8 52 10 38Z" stroke="none"/>
      <path d="M2 60 Q44 64 88 58 Q96 56 94 48" fill="none" stroke-width="3" stroke-linecap="round"/>
      <path d="M24 54 L22 61 M62 54 L64 59" fill="none" stroke-width="2.5"/>
      <path d="M30 40 Q42 22 56 40Z" stroke="none"/>
      <circle cx="43" cy="25" r="6.5" stroke="none"/>
      <path d="M36 23 Q42 6 54 18 Q48 18 48 23Z" stroke="none"/>
      <circle cx="55" cy="17" r="2.6" stroke="none"/>
      <path d="M14 40 Q4 22 22 26 Q30 36 26 40Z" stroke="none"/>
      <path d="M86 40 Q120 32 152 36 M180 33 Q188 30 198 28 M226 28 Q234 24 244 22" fill="none" stroke-width="1.2"/>
      <use href="#deer" x="150" y="18" width="42" height="38"/>
      <use href="#deer" x="196" y="12" width="42" height="38"/>
      <use href="#deer" x="242" y="6" width="42" height="38"/>
    </g>
    <circle cx="283" cy="19" r="2.4" fill="#ff4040"/>
  </svg>
</div>

<!-- Snowy village scene -->
<svg class="scene" id="scene" viewBox="0 0 400 240" preserveAspectRatio="xMidYMax meet" aria-hidden="true">
  <defs>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="3"/></filter>
  </defs>
  <!-- far hills -->
  <path d="M-800 165 L0 170 Q70 140 150 165 T300 160 T400 150 L1200 150 L1200 400 L-800 400Z" fill="#bfa8ee"/>
  <g id="trees"></g>
  <!-- house -->
  <g id="house">
    <rect x="230" y="150" width="90" height="50" fill="#9b3d3d"/>
    <rect x="300" y="118" width="12" height="26" fill="#6b3a3a"/>
    <rect x="298" y="115" width="16" height="5" rx="2" fill="#fff"/>
    <circle class="smoke" cx="306" cy="112" r="4" style="animation-delay:0s"/>
    <circle class="smoke" cx="306" cy="112" r="4" style="animation-delay:1.5s"/>
    <circle class="smoke" cx="306" cy="112" r="4" style="animation-delay:3s"/>
    <polygon points="220,154 275,116 330,154" fill="#3b2a55"/>
    <path d="M222 153 L275 118 L328 153" fill="none" stroke="#fff" stroke-width="7" stroke-linejoin="round" stroke-linecap="round"/>
    <rect x="236" y="158" width="26" height="22" fill="#ffd36b" filter="url(#glow)" opacity=".8"/>
    <rect x="288" y="158" width="26" height="22" fill="#ffd36b" filter="url(#glow)" opacity=".8"/>
    <rect x="240" y="160" width="20" height="18" fill="#ffd36b"/>
    <rect x="290" y="160" width="20" height="18" fill="#ffd36b"/>
    <path d="M250 160 V178 M240 169 H260 M300 160 V178 M290 169 H310" stroke="#8a4b2a" stroke-width="1.6"/>
    <rect x="266" y="162" width="18" height="30" rx="2" fill="#2a6b4a"/>
    <circle cx="275" cy="174" r="6" fill="none" stroke="#2fa05a" stroke-width="3"/>
    <circle cx="275" cy="168.5" r="2" fill="#e5322d"/>
    <g id="houseLights"></g>
  </g>
  <!-- mid hill -->
  <path d="M-800 190 L0 192 Q100 170 200 186 T400 180 L1200 180 L1200 400 L-800 400Z" fill="#e3d8fb"/>
  <!-- near hill -->
  <path d="M-800 215 L0 215 Q120 195 230 210 T400 205 L1200 205 L1200 400 L-800 400Z" fill="#f6f2ff"/>
  <!-- snowman -->
  <g id="snowman" stroke="#cfc2ee" stroke-width="1.2">
    <circle cx="120" cy="199" r="17" fill="#fff"/>
    <circle cx="120" cy="177" r="12" fill="#fff"/>
    <circle cx="120" cy="160" r="9" fill="#fff"/>
    <path d="M109 178 L92 166 M97 169 L94 162 M131 178 L148 168 M143 171 L147 164" stroke="#5a3a22" stroke-width="2.2" stroke-linecap="round" fill="none"/>
    <rect x="113" y="147" width="14" height="9" fill="#14101f" stroke="none"/>
    <rect x="109" y="155" width="22" height="2.8" rx="1" fill="#14101f" stroke="none"/>
    <rect x="109" y="167" width="22" height="5" rx="2.5" fill="#e5322d" stroke="none"/>
    <rect x="124" y="170" width="5" height="12" rx="2" fill="#e5322d" stroke="none"/>
    <polygon points="120,160 131,162 120,164" fill="#ff7a45" stroke="none"/>
    <circle cx="117" cy="157" r="1.1" fill="#14101f" stroke="none"/>
    <circle cx="123" cy="157" r="1.1" fill="#14101f" stroke="none"/>
    <circle cx="120" cy="176" r="1.3" fill="#14101f" stroke="none"/>
    <circle cx="120" cy="182" r="1.3" fill="#14101f" stroke="none"/>
  </g>
</svg>

<div class="snow" id="snow" aria-hidden="true"></div>

<main>
  <h1 class="fade" style="animation-delay:.2s">Hi Miles,</h1>
  <p class="line fade" style="animation-delay:1s">Welcome to <b>marcelvinesmusic.com</b>.</p>
  <p class="line fade" style="animation-delay:1.8s">This one’s all yours, along with <b>marcelvines.com</b>.</p>
  <p class="line fade" style="animation-delay:2.6s">Let’s work together to make it great.</p>
  <p class="merry fade" style="animation-delay:3.6s">Merry Christmas! 🎄</p>
  <p class="sign fade" style="animation-delay:4.4s">Love, Mom and Dad</p>
</main>

<script>
(function () {
  var NS = 'http://www.w3.org/2000/svg';
  var COLORS = ['#ff4f4f', '#ffd36b', '#6bd1ff', '#ff8fd0', '#9cff8f'];
  function el(tag, attrs, parent) {
    var e = document.createElementNS(NS, tag);
    for (var k in attrs) e.setAttribute(k, attrs[k]);
    if (parent) parent.appendChild(e);
    return e;
  }

  // Stars
  var sky = document.getElementById('sky');
  for (var i = 0; i < 45; i++) {
    var s = document.createElement('div');
    var size = 1 + Math.random() * 2.2;
    s.className = 'star';
    s.style.cssText = 'left:' + Math.random() * 100 + '%;top:' + Math.random() * 42 + '%;width:' + size + 'px;height:' + size + 'px;animation-duration:' + (2 + Math.random() * 4) + 's;animation-delay:' + (-Math.random() * 5) + 's';
    sky.appendChild(s);
  }

  // Snow
  var snow = document.getElementById('snow');
  for (var j = 0; j < 70; j++) {
    var f = document.createElement('div');
    var fs = 2 + Math.random() * 4;
    f.className = 'flake';
    f.style.cssText = 'left:' + Math.random() * 100 + '%;width:' + fs + 'px;height:' + fs + 'px;opacity:' + (0.5 + Math.random() * 0.45) + ';--dx:' + (Math.random() * 80 - 40) + 'px;animation-duration:' + (8 + Math.random() * 10) + 's;animation-delay:' + (-Math.random() * 18) + 's';
    snow.appendChild(f);
  }

  // Trees with lights
  var trees = document.getElementById('trees');
  [[28, 188, 1], [56, 192, 0.72], [352, 186, 1.05], [378, 192, 0.75], [180, 190, 0.6]].forEach(function (t) {
    var g = el('g', { transform: 'translate(' + t[0] + ',' + t[1] + ') scale(' + t[2] + ')' }, trees);
    el('rect', { x: -2, y: -4, width: 4, height: 8, fill: '#4a2f22' }, g);
    el('polygon', { points: '-15,-2 15,-2 0,-26', fill: '#1d3b4f' }, g);
    el('polygon', { points: '-12,-18 12,-18 0,-40', fill: '#214a5c' }, g);
    el('polygon', { points: '-9,-32 9,-32 0,-52', fill: '#265a6b' }, g);
    el('path', { d: 'M-9 -32 L0 -52 L9 -32 Q0 -36 -9 -32Z', fill: '#fff', opacity: '.9' }, g);
    [[-8, -8], [7, -10], [0, -20], [-6, -24], [6, -28], [0, -40], [-3, -34], [3, -46]].forEach(function (p, n) {
      var c = el('circle', { cx: p[0], cy: p[1], r: 1.6, fill: COLORS[n % COLORS.length], 'class': 'tl' }, g);
      c.style.animationDelay = (-Math.random() * 1.6) + 's';
    });
  });

  // House string lights
  var hl = document.getElementById('houseLights'), n = 0;
  function bulb(x, y) {
    var c = el('circle', { cx: x, cy: y, r: 2, fill: COLORS[n++ % COLORS.length], 'class': 'tl' }, hl);
    c.style.animationDelay = (-Math.random() * 1.6) + 's';
  }
  for (var a = 0; a <= 10; a++) {            // left roof edge
    bulb(222 + (53 / 10) * a, 153 - (35 / 10) * a + 4);
  }
  for (var b = 1; b <= 10; b++) {            // right roof edge
    bulb(275 + (53 / 10) * b, 118 + (35 / 10) * b + 4);
  }
  for (var d = 0; d <= 8; d++) {             // eave
    bulb(234 + d * 11.5, 151);
  }
})();
</script>
</body>
</html>
